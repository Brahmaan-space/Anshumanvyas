<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04060D">
<meta name="robots" content="noindex">
<title>Signal lost | Anshuman Vyas</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Spectral:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --void:#04060D; --line:#18243C; --line-2:#223252;
  --ink:#E8EDF7; --ink-2:#93A2BE; --ink-3:#5C6B88; --accent:#52D6E8; --amber:#FF9E4A;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Spectral',Georgia,serif;
  --mono:'IBM Plex Mono',Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0; min-height:100svh; background:var(--void); color:var(--ink);
  font-family:var(--body); display:flex; flex-direction:column; justify-content:center;
  padding:clamp(24px,6vw,72px); overflow:hidden; -webkit-font-smoothing:antialiased}
canvas{position:fixed; inset:0; z-index:0; pointer-events:none}
.w{position:relative; z-index:1; max-width:640px}
.code{font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--amber); margin-bottom:22px; display:flex; align-items:center; gap:12px}
.code::before{content:''; width:44px; height:1px; background:linear-gradient(90deg,var(--amber),transparent)}
h1{font-family:var(--display); font-weight:700; font-size:clamp(38px,8vw,88px); line-height:.9;
  letter-spacing:-.035em; margin:0 0 22px}
h1 em{font-style:normal; color:var(--accent)}
p{font-size:clamp(16px,2vw,19px); color:var(--ink-2); max-width:44ch; line-height:1.55; margin:0 0 34px}
a{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); text-decoration:none; border:1px solid rgba(82,214,232,.45);
  padding:13px 20px; border-radius:2px; display:inline-block; transition:background .3s}
a:hover{background:rgba(82,214,232,.08)}
a:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="s" aria-hidden="true"></canvas>
<div class="w">
  <div class="code">404 &middot; no return signal</div>
  <h1>Nothing in <em>this orbit</em></h1>
  <p>That address does not resolve to anything here. It may have moved, or it may never have existed.</p>
  <a href="/">Back to the surface</a>
</div>
<script>
(function(){
  var c=document.getElementById('s'), x=c.getContext('2d'), st=[], W=0, H=0,
      slow=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fit(){
    var d=Math.min(window.devicePixelRatio||1,1.75);
    W=innerWidth; H=innerHeight; c.width=W*d; c.height=H*d;
    x.setTransform(d,0,0,d,0,0);
    st=[];
    for(var i=0,n=Math.min(260,Math.round(W*H/7000));i<n;i++)
      st.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,
               a:Math.random()*.5+.15,s:Math.random()*.06+.01});
  }
  function draw(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<st.length;i++){
      var p=st[i];
      x.globalAlpha=p.a; x.fillStyle='#E8EDF7';
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.284); x.fill();
      if(!slow){ p.x+=p.s; if(p.x>W) p.x=0; }
    }
    x.globalAlpha=1;
    if(!slow) requestAnimationFrame(draw);
  }
  addEventListener('resize',function(){fit(); if(slow) draw();},{passive:true});
  fit(); draw();
})();
</script>
</body>
</html>
