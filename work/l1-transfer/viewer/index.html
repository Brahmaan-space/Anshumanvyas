<style>
:root{
  --void:#04060D; --panel:#080D1A; --panel-2:#0E1626; --line:#18243C; --line-2:#223252;
  --ink:#E8EDF7; --ink-2:#93A2BE; --ink-3:#5C6B88;
  --accent:#52D6E8; --amber:#FF9E4A;
  --display:'Inter','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--void); color:var(--ink); font-family:var(--mono);
  overflow:hidden; -webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}

#shell{position:relative; width:100%; height:100%; display:flex; flex-direction:column;
  background:
    radial-gradient(120% 90% at 50% 35%, rgba(20,32,56,.35), transparent 70%),
    var(--void)}

#stage{position:relative; flex:1; min-height:0}
#stage canvas{display:block; width:100%; height:100%}

/* ------------------------------------------------------------- caption */
#caption{position:absolute; left:0; top:0; padding:16px 18px; pointer-events:none;
  max-width:min(60%,420px)}
#cap-phase{font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:-.01em;
  display:block; margin-bottom:4px}
#cap-note{font-size:11px; line-height:1.6; color:var(--ink-3); display:block}
#clock{position:absolute; right:0; top:0; padding:16px 18px; font-size:11px;
  letter-spacing:.12em; color:var(--accent); pointer-events:none}

/* ------------------------------------------------------------- controls */
#bar-wrap{border-top:1px solid var(--line); background:rgba(8,13,26,.85); padding:11px 14px 13px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap}

#play{width:32px; height:32px; flex:none; border:1px solid var(--line-2); border-radius:2px;
  background:transparent; color:var(--accent); cursor:pointer; position:relative;
  transition:border-color .25s, background .25s}
#play:hover{border-color:var(--accent); background:rgba(82,214,232,.09)}
#play::before{content:''; position:absolute; inset:0; margin:auto; width:0; height:0;
  border-style:solid; border-width:6px 0 6px 10px; border-color:transparent transparent transparent currentColor;
  transform:translateX(1px)}
#play[data-state="playing"]::before{width:9px; height:11px; border:none;
  background:linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px,currentColor 6px 9px);
  transform:none}

#bar{flex:1; min-width:140px; height:22px; position:relative; cursor:pointer; touch-action:none}
#bar::before{content:''; position:absolute; left:0; right:0; top:50%; height:2px;
  transform:translateY(-50%); background:var(--line-2); border-radius:2px}
#fill{position:absolute; left:0; top:50%; height:2px; transform:translateY(-50%); width:0;
  background:var(--accent); border-radius:2px; box-shadow:0 0 8px rgba(82,214,232,.5)}
#fill::after{content:''; position:absolute; right:-4px; top:50%; transform:translateY(-50%);
  width:8px; height:8px; border-radius:50%; background:var(--accent)}

.chaps{display:flex; gap:6px; flex:none}
.chap{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); background:transparent; border:1px solid var(--line); border-radius:2px;
  padding:7px 10px; cursor:pointer; transition:color .25s, border-color .25s, background .25s}
.chap:hover{color:var(--ink-2); border-color:var(--line-2)}
.chap.on{color:var(--accent); border-color:rgba(82,214,232,.5); background:rgba(82,214,232,.08)}

#shell.static #play, #shell.static #bar{opacity:.4; pointer-events:none}

@media (max-width:560px){
  #caption{max-width:70%; padding:12px 13px}
  #cap-phase{font-size:13px}
  .chap{padding:6px 7px; letter-spacing:.08em}
  #bar-wrap{gap:9px; padding:9px 10px 11px}
}
